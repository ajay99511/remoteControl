name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test, cover
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # --fatal-warnings and --fatal-infos are the point of this step: the
      # rules promoted in analysis_options.yaml are the ones that would have
      # caught the critical defects in AUDIT_AND_STANDARDS_ANALYSIS.md, and a
      # gate that only warns is not a gate.
      - name: Analyze
        run: flutter analyze --fatal-warnings --fatal-infos

      - name: Test with coverage
        run: flutter test --coverage

      # A floor, not a target. Coverage is a diagnostic; this exists to stop
      # regression, not to be gamed upward. Raise it deliberately.
      - name: Enforce coverage floor
        run: |
          pct=$(awk -F: '/^LH:/{h+=$2} /^LF:/{f+=$2} END{printf "%.0f", h*100/f}' coverage/lcov.info)
          echo "Line coverage: ${pct}%"
          if [ "$pct" -lt 60 ]; then
            echo "::error::Coverage ${pct}% is below the 60% floor"
            exit 1
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: coverage/lcov.info
          if-no-files-found: warn

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
