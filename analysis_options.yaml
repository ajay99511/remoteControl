# Static analysis configuration.
#
# The rules promoted to `error` below are not stylistic. Each one would have
# caught a defect that actually shipped in this repository:
#
#   dead_code          -> C-1, the unreachable `else if (message == 'pong')`
#                         branch that disconnected every Samsung and LG
#                         session 35 seconds after it opened.
#   unawaited_futures  -> H-4, the Future.delayed timers nothing could cancel,
#                         and the fire-and-forget certificate write in C-2.
#   cancel_subscriptions / close_sinks
#                      -> H-4 again, the SSDP socket subscription that was
#                         never cancelled.
#
# See AUDIT_AND_STANDARDS_ANALYSIS.md for the full findings.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    dead_code: error
    unused_import: error
    unused_local_variable: error
    unawaited_futures: error
    # Async gaps across a BuildContext are how "widget disposed" crashes start.
    use_build_context_synchronously: error
  exclude:
    - "**/*.mocks.dart"
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures
